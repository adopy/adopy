name: Publish to PyPI and GitHub Releases

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Pure-Python package -> universal (py3-none-any) wheel, so the build
          # interpreter does not affect compatibility; use the latest stable.
          python-version: "3.14"

      - name: Build distributions
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Draft so the maintainer can review notes before publishing, matching the
      # previous Travis behaviour. Create-or-update so a re-run on the same tag
      # refreshes the assets instead of failing on an existing release.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "$TAG" --generate-notes --draft
          fi

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: the OIDC token replaces a stored API token. The PyPI
    # project must register this repo/workflow/environment as a trusted publisher.
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-runs (e.g. a re-pushed tag) skip an already-published version
          # instead of hard-failing; a real fix still needs a new version.
          skip-existing: true
