[project]
name = "adopy"
version = "0.5.0"
description = "Adaptive Design Optimization on Experimental Tasks"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
  { name = "Jaeyeong Yang", email = "jaeyeong.yang1125@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
]

[project.urls]
Homepage = "https://adopy.org"
Repository = "https://github.com/adopy/adopy"
Documentation = "https://adopy.org"

[project.optional-dependencies]
test = [
  "pytest",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "sphinx-autobuild",
  "recommonmark",
  "sphinxcontrib-rawfiles",
  "sphinx-issues",
  "ipykernel",
  "nbsphinx",
  "matplotlib",
  "jupyterlab",
]

[dependency-groups]
dev = [
  "autopep8",
  "flake8",
  "pylint",
  "mypy",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "adopy"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"
