[project]
name = "adopy"
version = "0.5.0"
description = "Adaptive Design Optimization on Experimental Tasks"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "GPL-3.0+" }
authors = [
  { name = "Jaeyeong Yang", email = "jaeyeong.yang1125@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "importlib-metadata; python_version < '3.8'",
  "numpy",
  "pandas",
  "scipy>=1.0.0",
]

[project.urls]
Homepage = "https://adopy.org"
Repository = "https://github.com/adopy/adopy"
Documentation = "https://adopy.org"

[project.optional-dependencies]
test = [
  "pytest>=6.0",
  "pytest-cov",
  "codecov",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "sphinx-autobuild",
  "recommonmark",
  "sphinxcontrib-rawfiles",
  "sphinx-issues",
  "ipykernel",
  "nbsphinx",
  "matplotlib",
  "jupyterlab",
]

[dependency-groups]
dev = [
  "autopep8",
  "flake8",
  "pylint",
  "mypy",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "adopy"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"
