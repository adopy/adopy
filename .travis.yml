---
os: linux
dist: xenial
language: python

cache:
  directories:
    - $HOME/.cache/uv

python:
  - "3.6"
  - "3.7"
  - "3.8"

env:
  global:
    - PATH="$HOME/.local/bin:$PATH"

before_install:
  - curl -LsSf https://astral.sh/uv/install.sh | sh

install:
  - uv sync --locked --all-extras

script:
  - uv run --extra test pytest --cov=adopy
  - uv run --extra test codecov

after_success:
  - uv run flake8 adopy --format=pylint --statistics --exit-zero
  - uv run pylint adopy --rcfile=setup.cfg --exit-zero

before_deploy:
  - uv build

deploy:
  provider: releases
  token: $GH_TOKEN
  file_glob: true
  file: dist/**/*
  draft: true
  on:
    tags: true
